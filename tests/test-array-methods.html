<!DOCTYPE html><html><head><title>Array Methods</title></head>
<body><div id="out"></div>
<script>
var P=0,F=0,T=0,fails=[];
function t(n,fn){T++;try{if(fn()===true){P++;console.log('PASS: '+n);} else {F++;fails.push(n);console.log('FAIL: '+n);}}catch(e){F++;fails.push(n+': '+e.message);console.log('FAIL: '+n+': '+e.message);}}

t('Array.from converts iterable', function(){
  var arr = Array.from('abc');
  return arr.length === 3 && arr[0] === 'a' && arr[1] === 'b' && arr[2] === 'c';
});

t('Array.isArray', function(){
  return Array.isArray([1,2]) === true && Array.isArray('not') === false && Array.isArray({length:0}) === false;
});

t('Array.prototype.flat', function(){
  var arr = [1, [2, [3]]];
  var f = arr.flat();
  return f.length === 3 && f[0] === 1 && f[1] === 2 && Array.isArray(f[2]);
});

t('Array.prototype.flat(Infinity)', function(){
  var arr = [1, [2, [3, [4]]]];
  var f = arr.flat(Infinity);
  return f.length === 4 && f[3] === 4;
});

t('Array.prototype.flatMap', function(){
  var arr = [1, 2, 3];
  var result = arr.flatMap(function(x){ return [x, x*2]; });
  return result.length === 6 && result[0] === 1 && result[1] === 2 && result[2] === 2 && result[3] === 4;
});

t('Array.prototype.includes', function(){
  var arr = [1, 2, 3, NaN];
  return arr.includes(2) === true && arr.includes(4) === false && arr.includes(NaN) === true;
});

t('Array.prototype.find', function(){
  var arr = [1, 2, 3, 4, 5];
  var found = arr.find(function(x){ return x > 3; });
  return found === 4;
});

t('Array.prototype.findIndex', function(){
  var arr = [1, 2, 3, 4, 5];
  var idx = arr.findIndex(function(x){ return x > 3; });
  return idx === 3;
});

t('Array.prototype.fill', function(){
  var arr = [1, 2, 3, 4];
  arr.fill(0, 1, 3);
  return arr[0] === 1 && arr[1] === 0 && arr[2] === 0 && arr[3] === 4;
});

t('Array.prototype.copyWithin', function(){
  var arr = [1, 2, 3, 4, 5];
  arr.copyWithin(0, 3);
  return arr[0] === 4 && arr[1] === 5 && arr[2] === 3;
});

t('Array.of', function(){
  var arr = Array.of(1, 2, 3);
  return arr.length === 3 && arr[0] === 1 && arr[1] === 2 && arr[2] === 3;
});

var s='=== RESULTS: '+P+'/'+T+' passed, '+F+' failed ===';
console.log(s);
fails.forEach(function(f){console.log('FAIL: '+f);});
document.getElementById('out').textContent=s+'\n'+fails.join('\n');
</script></body></html>
