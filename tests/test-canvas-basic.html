<!DOCTYPE html><html><head><title>Test Canvas Basic</title></head>
<body><div id="out"></div>
<canvas id="c" width="100" height="100"></canvas>
<script>
var P=0,F=0,T=0,fails=[];
function t(n,fn){T++;try{if(fn()===true){P++;} else {F++;fails.push(n);}}catch(e){F++;fails.push(n+': '+e.message);}}

t('canvas.getContext 2d returns non-null', function(){
  var c = document.getElementById('c');
  var ctx = c.getContext('2d');
  return ctx !== null && ctx !== undefined;
});

t('fillRect exists', function(){
  var ctx = document.getElementById('c').getContext('2d');
  return typeof ctx.fillRect === 'function';
});

t('strokeRect exists', function(){
  var ctx = document.getElementById('c').getContext('2d');
  return typeof ctx.strokeRect === 'function';
});

t('clearRect exists', function(){
  var ctx = document.getElementById('c').getContext('2d');
  return typeof ctx.clearRect === 'function';
});

t('fillStyle get/set', function(){
  var ctx = document.getElementById('c').getContext('2d');
  ctx.fillStyle = '#ff0000';
  var v = ctx.fillStyle;
  return typeof v === 'string' && v.length > 0;
});

t('strokeStyle get/set', function(){
  var ctx = document.getElementById('c').getContext('2d');
  ctx.strokeStyle = '#00ff00';
  var v = ctx.strokeStyle;
  return typeof v === 'string' && v.length > 0;
});

var s='=== RESULTS: '+P+'/'+T+' passed, '+F+' failed ===';
console.log(s);
fails.forEach(function(f){console.log('FAIL: '+f);});
document.getElementById('out').textContent=s+'\n'+fails.join('\n');
</script></body></html>
