<!DOCTYPE html><html><head><title>Test Intl</title></head>
<body><div id="out"></div>
<script>
var P=0,F=0,T=0,fails=[];
function t(n,fn){T++;try{if(fn()===true){P++;} else {F++;fails.push(n);}}catch(e){F++;fails.push(n+': '+e.message);}}

t('Intl object exists', function(){
  return typeof Intl === 'object' && Intl !== null;
});

t('Intl.NumberFormat exists', function(){
  return typeof Intl.NumberFormat === 'function';
});

t('Intl.DateTimeFormat exists', function(){
  return typeof Intl.DateTimeFormat === 'function';
});

var s='=== RESULTS: '+P+'/'+T+' passed, '+F+' failed ===';
console.log(s);
fails.forEach(function(f){console.log('FAIL: '+f);});
document.getElementById('out').textContent=s+'\n'+fails.join('\n');
</script></body></html>
