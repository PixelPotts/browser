<!DOCTYPE html><html><head><title>DOM Attributes</title></head>
<body><div id="out"></div>
<div id="target" class="foo" data-x="42"></div>
<script>
var P=0,F=0,T=0,fails=[];
function t(n,fn){T++;try{if(fn()===true){P++;console.log('PASS: '+n);} else {F++;fails.push(n);console.log('FAIL: '+n);}}catch(e){F++;fails.push(n+': '+e.message);console.log('FAIL: '+n+': '+e.message);}}

var el = document.getElementById('target');

t('hasAttribute returns true for present attr', function(){
  return el.hasAttribute('class') === true;
});

t('hasAttribute returns false for absent attr', function(){
  return el.hasAttribute('style') === false;
});

t('getAttribute returns value', function(){
  return el.getAttribute('data-x') === '42';
});

t('setAttribute sets value', function(){
  el.setAttribute('data-y', 'hello');
  return el.getAttribute('data-y') === 'hello';
});

t('removeAttribute removes attr', function(){
  el.setAttribute('data-tmp', '1');
  el.removeAttribute('data-tmp');
  return el.hasAttribute('data-tmp') === false;
});

t('toggleAttribute adds when absent', function(){
  var result = el.toggleAttribute('hidden');
  var has = el.hasAttribute('hidden');
  el.removeAttribute('hidden');
  return result === true && has === true;
});

t('toggleAttribute removes when present', function(){
  el.setAttribute('hidden', '');
  var result = el.toggleAttribute('hidden');
  return result === false && el.hasAttribute('hidden') === false;
});

t('toggleAttribute force=true adds', function(){
  var result = el.toggleAttribute('hidden', true);
  var has = el.hasAttribute('hidden');
  el.removeAttribute('hidden');
  return result === true && has === true;
});

t('toggleAttribute force=false removes', function(){
  el.setAttribute('hidden', '');
  var result = el.toggleAttribute('hidden', false);
  return result === false && el.hasAttribute('hidden') === false;
});

t('getAttributeNames returns array with all attrs', function(){
  var names = el.getAttributeNames();
  return Array.isArray(names) && names.indexOf('class') !== -1 && names.indexOf('data-x') !== -1;
});

var s='=== RESULTS: '+P+'/'+T+' passed, '+F+' failed ===';
console.log(s);
fails.forEach(function(f){console.log('FAIL: '+f);});
document.getElementById('out').textContent=s+'\n'+fails.join('\n');
</script></body></html>
