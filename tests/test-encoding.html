<!DOCTYPE html><html><head><title>Test Encoding</title></head>
<body><div id="out"></div>
<script>
var P=0,F=0,T=0,fails=[];
function t(n,fn){T++;try{if(fn()===true){P++;} else {F++;fails.push(n);}}catch(e){F++;fails.push(n+': '+e.message);}}

t('btoa/atob roundtrip', function(){
  var orig = 'Hello, World!';
  var encoded = btoa(orig);
  var decoded = atob(encoded);
  return decoded === orig;
});

t('encodeURIComponent/decodeURIComponent roundtrip', function(){
  var orig = 'hello world&foo=bar';
  var encoded = encodeURIComponent(orig);
  var decoded = decodeURIComponent(encoded);
  return decoded === orig;
});

var s='=== RESULTS: '+P+'/'+T+' passed, '+F+' failed ===';
console.log(s);
fails.forEach(function(f){console.log('FAIL: '+f);});
document.getElementById('out').textContent=s+'\n'+fails.join('\n');
</script></body></html>
