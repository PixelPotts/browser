<!DOCTYPE html><html><head><title>Test Misc DOM</title></head>
<body><div id="out"></div>
<script>
var P=0,F=0,T=0,fails=[];
function t(n,fn){T++;try{if(fn()===true){P++;} else {F++;fails.push(n);}}catch(e){F++;fails.push(n+': '+e.message);}}

t('isSameNode(self) returns true', function(){
  var el = document.createElement('div');
  return el.isSameNode(el) === true;
});

t('isEqualNode for equal elements', function(){
  var a = document.createElement('div');
  a.setAttribute('class', 'x');
  var b = document.createElement('div');
  b.setAttribute('class', 'x');
  return a.isEqualNode(b) === true;
});

t('getRootNode returns something', function(){
  var el = document.createElement('div');
  document.body.appendChild(el);
  var root = el.getRootNode();
  var ok = root !== null && root !== undefined;
  document.body.removeChild(el);
  return ok;
});

t('compareDocumentPosition returns number', function(){
  var a = document.createElement('div');
  var b = document.createElement('div');
  document.body.appendChild(a);
  document.body.appendChild(b);
  var result = a.compareDocumentPosition(b);
  document.body.removeChild(a);
  document.body.removeChild(b);
  return typeof result === 'number';
});

t('element.normalize does not throw', function(){
  var el = document.createElement('div');
  el.appendChild(document.createTextNode('a'));
  el.appendChild(document.createTextNode('b'));
  el.normalize();
  return true;
});

var s='=== RESULTS: '+P+'/'+T+' passed, '+F+' failed ===';
console.log(s);
fails.forEach(function(f){console.log('FAIL: '+f);});
document.getElementById('out').textContent=s+'\n'+fails.join('\n');
</script></body></html>
