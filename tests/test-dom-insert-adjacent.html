<!DOCTYPE html><html><head><title>DOM insertAdjacent*</title></head>
<body><div id="out"></div>
<div id="container"><div id="target">original</div></div>
<script>
var P=0,F=0,T=0,fails=[];
function t(n,fn){T++;try{if(fn()===true){P++;console.log('PASS: '+n);} else {F++;fails.push(n);console.log('FAIL: '+n);}}catch(e){F++;fails.push(n+': '+e.message);console.log('FAIL: '+n+': '+e.message);}}

// Reset container for each group
function reset(){
  var c = document.getElementById('container');
  c.innerHTML = '<div id="target">original</div>';
  return document.getElementById('target');
}

t('insertAdjacentHTML beforebegin', function(){
  var el = reset();
  el.insertAdjacentHTML('beforebegin', '<span class="bb">BB</span>');
  var prev = el.previousElementSibling;
  return prev && prev.className === 'bb';
});

t('insertAdjacentHTML afterbegin', function(){
  var el = reset();
  el.insertAdjacentHTML('afterbegin', '<span class="ab">AB</span>');
  return el.firstElementChild && el.firstElementChild.className === 'ab';
});

t('insertAdjacentHTML beforeend', function(){
  var el = reset();
  el.insertAdjacentHTML('beforeend', '<span class="be">BE</span>');
  return el.lastElementChild && el.lastElementChild.className === 'be';
});

t('insertAdjacentHTML afterend', function(){
  var el = reset();
  el.insertAdjacentHTML('afterend', '<span class="ae">AE</span>');
  var next = el.nextElementSibling;
  return next && next.className === 'ae';
});

t('insertAdjacentElement inserts element', function(){
  var el = reset();
  var span = document.createElement('span');
  span.className = 'iae';
  var result = el.insertAdjacentElement('beforeend', span);
  return el.lastElementChild === span && result === span;
});

t('insertAdjacentText inserts text node', function(){
  var el = reset();
  var before = el.childNodes.length;
  el.insertAdjacentText('beforeend', 'hello');
  return el.childNodes.length === before + 1 && el.lastChild.nodeType === 3 && el.lastChild.textContent === 'hello';
});

var s='=== RESULTS: '+P+'/'+T+' passed, '+F+' failed ===';
console.log(s);
fails.forEach(function(f){console.log('FAIL: '+f);});
document.getElementById('out').textContent=s+'\n'+fails.join('\n');
</script></body></html>
