<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NoteSketch - Stage 2</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
}

.app-header {
  background: #1e293b;
  padding: 12px 24px;
  border-bottom: 1px solid #475569;
}
.app-header h1 {
  font-size: 20px;
  color: #38bdf8;
}

.app-body {
  flex-grow: 1;
  flex-shrink: 1;
  flex-basis: 0;
  display: flex;
}

.sidebar {
  width: 260px;
  background: #1e293b;
  border-right: 1px solid #334155;
  padding: 16px;
}

.main {
  flex: 1;
  background: #131c2e;
  padding: 16px;
}

.status-bar {
  padding: 6px 16px;
  background: #0ea5e9;
  color: white;
  font-size: 12px;
}
</style>
</head>
<body>

<div class="app-header">
  <h1>NoteSketch</h1>
</div>

<div class="app-body">
  <div class="sidebar">
    <p>Sidebar (260px fixed)</p>
  </div>
  <div class="main">
    <p>Main area (flex: 1)</p>
  </div>
</div>

<div class="status-bar">
  <span>Stage 2: Two-column flex layout</span>
</div>

</body>
</html>
