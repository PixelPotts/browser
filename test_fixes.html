<!DOCTYPE html>
<html><head><title>Test</title></head><body>
<div id="wrapper">
<h1 id="test">Test Page</h1>
<p class="para">Paragraph</p>
</div>
<script>
var results = [];
// Test 1: document.defaultView
results.push("T1:dv=" + (typeof document.defaultView) + " eq=" + (document.defaultView === window));

// Test 2: Symbol.iterator on NodeList
var nl = document.querySelectorAll("h1");
results.push("T2:iter=" + (typeof nl[Symbol.iterator]));

// Test 3: ownerDocument
var h1 = document.querySelector("h1");
results.push("T3:od=" + (h1 ? (h1.ownerDocument === document) : "NO_H1"));

// Test 4: ownerDocument.defaultView
if (h1 && h1.ownerDocument) {
    results.push("T4:odv=" + (typeof h1.ownerDocument.defaultView) + " eq=" + (h1.ownerDocument.defaultView === window));
} else {
    results.push("T4:FAIL od=" + (h1 ? h1.ownerDocument : "no_h1"));
}

// Test 5: for..of iteration
try {
    var count = 0;
    for (var el of document.querySelectorAll("*")) count++;
    results.push("T5:forof=" + count);
} catch(e) {
    results.push("T5:ERROR=" + e.message);
}

// Test 6: previousElementSibling
var p = document.querySelector("p");
results.push("T6:prevSib=" + (p ? (p.previousElementSibling ? p.previousElementSibling.tagName : "null") : "no_p"));

// Test 7: nextElementSibling
results.push("T7:nextSib=" + (h1 ? (h1.nextElementSibling ? h1.nextElementSibling.tagName : "null") : "no_h1"));

results.forEach(function(r) { console.log(r); });
</script>
</body></html>
