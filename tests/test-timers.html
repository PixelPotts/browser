<!DOCTYPE html><html><head><title>Test Timers</title></head>
<body><div id="out"></div>
<script>
var P=0,F=0,T=0,fails=[];
function t(n,fn){T++;try{if(fn()===true){P++;} else {F++;fails.push(n);}}catch(e){F++;fails.push(n+': '+e.message);}}

t('setTimeout exists', function(){
  return typeof setTimeout === 'function';
});

t('clearTimeout exists', function(){
  return typeof clearTimeout === 'function';
});

t('setInterval exists', function(){
  return typeof setInterval === 'function';
});

t('clearInterval exists', function(){
  return typeof clearInterval === 'function';
});

t('requestAnimationFrame exists', function(){
  return typeof requestAnimationFrame === 'function';
});

t('cancelAnimationFrame exists', function(){
  return typeof cancelAnimationFrame === 'function';
});

var s='=== RESULTS: '+P+'/'+T+' passed, '+F+' failed ===';
console.log(s);
fails.forEach(function(f){console.log('FAIL: '+f);});
document.getElementById('out').textContent=s+'\n'+fails.join('\n');
</script></body></html>
