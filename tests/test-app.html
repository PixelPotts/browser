<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NoteSketch - Stage 10</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
}

.app-header {
  background: #1e293b;
  padding: 12px 24px;
  border-bottom: 1px solid #475569;
}
.app-header h1 {
  font-size: 20px;
  color: #38bdf8;
}

.app-body {
  flex-grow: 1;
  flex-shrink: 1;
  flex-basis: 0;
  display: flex;
}

.sidebar {
  width: 260px;
  background: #1e293b;
  border-right: 1px solid #334155;
  display: flex;
  flex-direction: column;
}

.sidebar-header {
  padding: 12px;
  border-bottom: 1px solid #334155;
}
.sidebar-header input {
  width: 100%;
  padding: 8px 12px;
  border-radius: 6px;
  background: #0f172a;
  border: 1px solid #475569;
  color: #e2e8f0;
  font-size: 14px;
}

.note-list {
  flex: 1;
  padding: 8px;
}

.note-item {
  padding: 10px 12px;
  border-radius: 6px;
  margin-bottom: 4px;
}
.note-item.active {
  background: #0ea5e9;
  color: white;
}
.note-item .note-title {
  font-size: 14px;
  font-weight: 500;
}
.note-item .note-preview {
  font-size: 12px;
  color: #94a3b8;
  margin-top: 2px;
}
.note-item.active .note-preview {
  color: #e0f2fe;
}

.sidebar-footer {
  padding: 12px;
  border-top: 1px solid #334155;
  font-size: 13px;
  color: #94a3b8;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.toolbar {
  padding: 8px 16px;
  background: #1e293b;
  border-bottom: 1px solid #334155;
  display: flex;
  align-items: center;
  gap: 8px;
}
.toolbar input {
  flex: 1;
  padding: 6px 12px;
  border-radius: 6px;
  background: #0f172a;
  border: 1px solid #475569;
  color: #e2e8f0;
  font-size: 14px;
}

.editor-area {
  flex: 1;
  display: flex;
}
.text-editor {
  flex: 1;
  padding: 16px;
}
.text-editor textarea {
  width: 100%;
  height: 100%;
  background: #1e293b;
  border: 1px solid #475569;
  border-radius: 6px;
  color: #e2e8f0;
  font-size: 14px;
  padding: 12px;
}
.canvas-panel {
  width: 320px;
  background: #1e293b;
  border-left: 1px solid #334155;
  padding: 16px;
  display: flex;
  flex-direction: column;
}
.canvas-panel canvas {
  width: 100%;
  height: 200px;
  background: #0f172a;
  border: 1px solid #475569;
  border-radius: 6px;
}
.canvas-label {
  font-size: 12px;
  color: #94a3b8;
  margin-bottom: 8px;
}
.color-swatches {
  display: flex;
  gap: 6px;
  margin-top: 12px;
}
.swatch {
  width: 24px;
  height: 24px;
  border-radius: 4px;
  border: 2px solid #475569;
}
.swatch.active {
  border-color: #38bdf8;
}

.main-status {
  padding: 4px 16px;
  background: #1e293b;
  border-top: 1px solid #334155;
  font-size: 12px;
  color: #94a3b8;
}

.btn {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  border: 1px solid #475569;
  background: #334155;
  color: #e2e8f0;
}
.btn-primary {
  background: #0ea5e9;
  border: 1px solid #0284c7;
  color: white;
}
.btn-danger {
  background: #ef4444;
  border: 1px solid #dc2626;
  color: white;
}

.sidebar-footer {
  display: flex;
  gap: 8px;
}

.status-bar {
  padding: 6px 16px;
  background: #0ea5e9;
  color: white;
  font-size: 12px;
}
</style>
</head>
<body>

<div class="app-header">
  <h1>NoteSketch</h1>
</div>

<div class="app-body">
  <div class="sidebar">
    <div class="sidebar-header">
      <input type="text" placeholder="Search notes...">
    </div>
    <div class="note-list" id="noteList">
    </div>
    <div class="sidebar-footer">
      <span class="btn btn-primary">+ New Note</span>
      <span class="btn">Export</span>
    </div>
  </div>
  <div class="main">
    <div class="toolbar">
      <input type="text" placeholder="Note title...">
      <span class="btn">+ Tag</span>
      <span class="btn btn-danger">Delete</span>
    </div>
    <div class="editor-area">
      <div class="text-editor">
        <textarea placeholder="Start typing your note..."></textarea>
      </div>
      <div class="canvas-panel">
        <div class="canvas-label">Sketch Pad</div>
        <canvas id="sketchCanvas" width="288" height="200"></canvas>
        <div class="color-swatches" id="swatches">
          <div class="swatch active" style="background: #e2e8f0;"></div>
          <div class="swatch" style="background: #ef4444;"></div>
          <div class="swatch" style="background: #22c55e;"></div>
          <div class="swatch" style="background: #3b82f6;"></div>
          <div class="swatch" style="background: #eab308;"></div>
        </div>
      </div>
    </div>
    <div class="main-status">
      0 words, 0 chars
    </div>
  </div>
</div>

<div class="status-bar">
  <span>Stage 10: Canvas drawing + color swatches</span>
</div>

<script>
var notes = [
  { title: "Welcome to NoteSketch", preview: "This is a demo app that exercises...", active: true },
  { title: "Shopping List", preview: "Milk, Eggs, Bread, Coffee..." },
  { title: "Meeting Notes", preview: "Q3 Planning - Review roadmap..." },
  { title: "Ideas", preview: "Random thoughts and brainstorms..." },
  { title: "Todo", preview: "Fix layout engine, add buttons..." }
];

function renderNotes() {
  var list = document.getElementById("noteList");
  list.innerHTML = "";
  for (var i = 0; i < notes.length; i++) {
    var item = document.createElement("div");
    item.className = "note-item";
    if (notes[i].active) {
      item.className = "note-item active";
    }

    var title = document.createElement("div");
    title.className = "note-title";
    title.innerText = notes[i].title;
    item.appendChild(title);

    var preview = document.createElement("div");
    preview.className = "note-preview";
    preview.innerText = notes[i].preview;
    item.appendChild(preview);

    list.appendChild(item);
  }
}

renderNotes();

// Canvas drawing
var canvas = document.getElementById("sketchCanvas");
var ctx = canvas.getContext("2d");
var drawing = false;
var currentColor = "#e2e8f0";

ctx.strokeStyle = currentColor;
ctx.lineWidth = 3;
ctx.lineCap = "round";

canvas.addEventListener("mousedown", function(e) {
  drawing = true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX, e.offsetY);
});

canvas.addEventListener("mousemove", function(e) {
  if (!drawing) return;
  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
});

canvas.addEventListener("mouseup", function() {
  drawing = false;
});

// Color swatch selection
var swatches = document.getElementById("swatches");
var swatchEls = swatches.children;
var colors = ["#e2e8f0", "#ef4444", "#22c55e", "#3b82f6", "#eab308"];

for (var i = 0; i < swatchEls.length; i++) {
  (function(idx) {
    swatchEls[idx].addEventListener("click", function() {
      for (var j = 0; j < swatchEls.length; j++) {
        swatchEls[j].className = "swatch";
      }
      swatchEls[idx].className = "swatch active";
      currentColor = colors[idx];
      ctx.strokeStyle = currentColor;
    });
  })(i);
}
</script>

</body>
</html>
