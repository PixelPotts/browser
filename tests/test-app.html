<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NoteSketch - Stage 1</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
}

.app-body {
  flex-grow: 1;
  flex-shrink: 1;
  flex-basis: 0;
}

.app-header {
  background: #1e293b;
  padding: 12px 24px;
  border-bottom: 1px solid #475569;
}
.app-header h1 {
  font-size: 20px;
  color: #38bdf8;
}

.status-bar {
  padding: 6px 16px;
  background: #0ea5e9;
  color: white;
  font-size: 12px;
}

</head>

<div class="app-header">
  <h1>NoteSketch</h1>
</div>

<div class="app-body">
  <p style="padding: 24px; font-size: 16px;">Stage 1: Basic structure with dark theme. This tests block layout, background-color, color, font-size, and padding.</p>
</div>

<div class="status-bar">
  <span>Ready</span>
</div>

</html>
